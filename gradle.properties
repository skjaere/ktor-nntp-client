group=io.skjaere
# x-release-please-start-version
version=0.8.0
# x-release-please-end
kotlin.code.style=official
# Gradle's default (384 MiB of metaspace) can run out when one daemon runs several builds in a row. Setting this
# replaces all of Gradle's defaults, so it asks for the heap dump on OutOfMemoryError again.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
