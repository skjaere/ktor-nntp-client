group=io.skjaere
# x-release-please-start-version
version=0.7.0
# x-release-please-end
kotlin.code.style=official
# The NNTP libraries' and debridav's builds share one Gradle daemon, and Gradle's default (384 MiB of metaspace)
# runs out after a few of them. Setting this replaces all of Gradle's defaults, so it asks for the heap dump on
# OutOfMemoryError again.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
