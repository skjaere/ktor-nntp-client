[versions]
kotlin = "2.3.21"
ktor = "3.5.2"
junit = "5.11.4"
kotlinx-coroutines = "1.11.0"
testcontainers = "2.0.5"
micrometer = "1.14.4"

[libraries]
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }
ktor-network-tls = { module = "io.ktor:ktor-network-tls", version.ref = "ktor" }
ktor-io = { module = "io.ktor:ktor-io", version.ref = "ktor" }
ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
slf4j-api = { module = "org.slf4j:slf4j-api", version = "2.0.20" }
logback-classic = { module = "ch.qos.logback:logback-classic", version = "1.5.16" }
conscrypt-openjdk-uber = { module = "org.conscrypt:conscrypt-openjdk-uber", version = "2.5.2" }
rapidyenc = { module = "com.github.skjaere:rapidyenc-kotlin-wrapper", version = "v0.3.0" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
mock-nntp-testcontainer = { module = "com.github.skjaere:mock-nntp-server", version = "v0.1.0" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinx-kover = { id = "org.jetbrains.kotlinx.kover", version = "0.9.11" }
